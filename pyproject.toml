[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "smfish"
version = "1.0.0"
description = "3D smFISH quantification: Cellpose-SAM segmentation, LoG spot detection, thresholds calibrated on control probes"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
# The published runs used the versions in environment.yml; big-fish needs numpy < 2.
dependencies = [
    "numpy>=1.26,<2",
    "scipy>=1.12",
    "pandas>=2.2",
    "scikit-image>=0.22",
    "tifffile==2023.2.28",          # aicsimageio 4.14 needs < 2023.3.15
    "pyarrow>=15.0.2",
    "pyyaml>=6",
    "matplotlib>=3.8",
    "big-fish==0.6.2",
    "aicsimageio==4.14.0",
]

[project.optional-dependencies]
segmentation = ["cellpose==4.2.1.1", "torch==2.2.2", "torchvision==0.17.2", "opencv-python-headless==4.10.0.84"]
notebooks = ["jupyterlab", "ipykernel", "nbformat"]
test = ["pytest>=8"]

[project.scripts]
smfish = "smfish.cli:main"

[tool.setuptools.packages.find]
include = ["smfish*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
